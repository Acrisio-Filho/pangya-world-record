name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar config.js com secrets
        run: |
          cat > frontend/js/config.js <<'EOF'
          const URL_API = "${{ secrets.PWR_URL_EXEC }}";
          const ORIGEM_TOKEN = "${{ secrets.PWR_ORIGEM_TOKEN }}";
          const GOOGLE_CLIENT_ID = "${{ secrets.PWR_GOOGLE_CLIENT_ID }}";
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
