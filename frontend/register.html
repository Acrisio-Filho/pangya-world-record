<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastrar — PangYa World Record</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><a href="index.html"><strong>PangYa World Record</strong></a><nav id="nav-user"></nav></header>
<main><h1>Cadastrar</h1>
<form id="f"><input id="nickname" placeholder="Nickname (máx 22)" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Senha (min 4)" required><input id="bio" placeholder="Info sobre você (opcional)"><input id="youtube_url" placeholder="Canal do YouTube (opcional, só YouTube)"><button>Criar conta</button></form>
<p>ou</p>
<div id="google-btn"></div>
</main>
<footer>© <a href="https://github.com/Acrisio-Filho">Acrisio Filho</a> · <a href="https://github.com/Acrisio-Filho/pangya-world-record/blob/main/LICENSE">MIT</a> · <a href="privacy.html">Privacidade</a></footer>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  if ([...nickname.value.trim()].length > 22) { toast("Nickname até 22 caracteres.", "error"); return; }
  const r = await apiPost("register", { nickname: nickname.value, email: email.value, password: password.value, bio: bio.value, youtube_url: youtube_url.value });
  if (r.erro) { toast(r.erro, "error"); return; }
  toast("Conta criada bloqueada — um admin vai liberar para envio de records.", "success");
  setTimeout(() => location.href = "login.html", 2500);
};
</script>
</body></html>
