<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PangYa World Record</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header><a href="index.html"><strong>PangYa World Record</strong></a><nav id="nav-user"></nav></header>
<main>
<h1>Records</h1>
<div class="filters">
<select id="f-course"><option value="">Todos os courses</option></select>
<select id="f-band"><option value="">Todas as faixas</option></select>
<select id="f-method"><option value="">Todos os métodos</option><option value="sem_ajuda">Sem ajuda</option><option value="com_ajuda">Com ajuda</option></select>
<select id="f-wind"><option value="">Todos os ventos</option><option value="normal">Normal</option><option value="natural">Natural</option></select>
<input id="f-nick" placeholder="Buscar nickname">
<label><input type="checkbox" id="f-best"> só BEST</label>
<button id="f-btn">Buscar</button>
</div>
<div id="msg"></div>
<table><thead><tr><th>Score</th><th>Pang</th><th>Método</th><th>Vento</th><th>Usuário</th><th>Course</th><th>Faixa</th><th>Força</th><th>Enviado em</th><th>Vídeo/Print</th></tr></thead>
<tbody id="rows"></tbody></table>
<div id="pager" class="filters"></div>
</main>
<footer>© <a href="https://github.com/Acrisio-Filho">Acrisio Filho</a> · <a href="https://github.com/Acrisio-Filho/pangya-world-record/blob/main/LICENSE">MIT</a> · <a href="privacy.html">Privacidade</a></footer>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/records.js"></script>
</body></html>
